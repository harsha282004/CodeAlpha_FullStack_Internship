services:
  # Dedicated local PostgreSQL for Connectly (Task2) only. Bound to
  # 127.0.0.1:5433 so it never collides with Task1's Postgres (or anything
  # else) on the default 5432 port, and is never reachable off this machine.
  task2-postgres:
    image: postgres:16-alpine
    container_name: connectly-task2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: connectly
      POSTGRES_PASSWORD: connectly_dev_password
      POSTGRES_DB: connectly
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - task2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectly -d connectly"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  task2_postgres_data:
    name: connectly_task2_postgres_data
